<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#09060d" />
  <title>MÁ IDEIA | Dado</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09060d;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}body{min-height:100svh}.app{height:100svh;display:grid;grid-template-rows:auto 1fr auto;position:relative;background:radial-gradient(circle at 50% 40%,#1d1029 0,#0e0913 42%,#09060d 75%);padding:max(22px,env(safe-area-inset-top)) 18px max(26px,env(safe-area-inset-bottom))}.brand{text-align:center;font-size:13px;font-weight:800;letter-spacing:.28em;opacity:.76;margin-top:4px}.stage{position:relative;min-height:0}#dice{width:100%;height:100%;display:block;touch-action:manipulation}.controls{text-align:center;min-height:156px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.result{font-size:clamp(30px,10vw,48px);line-height:1;font-weight:950;letter-spacing:.02em;min-height:52px;opacity:0;transform:translateY(8px) scale(.94);transition:.28s ease;margin-bottom:14px}.result.show{opacity:1;transform:none}.roll{border:1px solid rgba(255,255,255,.14);background:linear-gradient(180deg,#8d45ed,#6a25c5);box-shadow:0 12px 34px rgba(112,40,203,.28),inset 0 1px rgba(255,255,255,.2);color:white;border-radius:999px;min-width:218px;padding:15px 24px;font-size:14px;font-weight:900;letter-spacing:.08em}.roll:active{transform:scale(.97)}.roll:disabled{opacity:.58}.status{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.45;margin:13px 0 0}.glow{position:absolute;left:50%;bottom:10%;width:58%;height:13%;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(128,55,219,.28),transparent 68%);filter:blur(18px);pointer-events:none}.error{position:fixed;inset:0;display:none;place-items:center;padding:28px;text-align:center;background:#09060d;color:#fff;z-index:20}.error.show{display:grid}.error strong{display:block;font-size:20px;margin-bottom:10px}.error small{opacity:.6}
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">MÁ IDEIA</div>
    <section class="stage"><div class="glow"></div><canvas id="dice" aria-label="Dado 3D interativo"></canvas></section>
    <section class="controls">
      <div id="result" class="result" aria-live="polite"></div>
      <button id="roll" class="roll" type="button">TOQUE PARA JOGAR</button>
      <p id="status" class="status">toque no dado ou no botão</p>
    </section>
  </main>
  <div id="error" class="error"><div><strong>Não foi possível iniciar o 3D.</strong><small>Atualize a página e tente novamente.</small></div></div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.179.1';
    import { RoundedBoxGeometry } from 'https://esm.sh/three@0.179.1/examples/jsm/geometries/RoundedBoxGeometry.js';

    const faces=[
      {id:1,result:'BEIJO',normal:[0,0,1]},
      {id:2,result:'TAPA',normal:[1,0,0]},
      {id:3,result:'VERDADE',normal:[0,1,0]},
      {id:4,result:'DESAFIO',normal:[0,-1,0]},
      {id:5,result:'PASSA A VEZ',normal:[-1,0,0]},
      {id:6,result:'MÁ IDEIA',normal:[0,0,-1]},
    ];
    const layouts={1:[[0,0]],2:[[-.4,.4],[.4,-.4]],3:[[-.4,.4],[0,0],[.4,-.4]],4:[[-.4,.4],[.4,.4],[-.4,-.4],[.4,-.4]],5:[[-.4,.4],[.4,.4],[0,0],[-.4,-.4],[.4,-.4]],6:[[-.4,.46],[-.4,0],[-.4,-.46],[.4,.46],[.4,0],[.4,-.46]]};
    const canvas=document.querySelector('#dice');
    const resultEl=document.querySelector('#result');
    const button=document.querySelector('#roll');
    const status=document.querySelector('#status');
    const errorEl=document.querySelector('#error');

    try{
      const scene=new THREE.Scene();
      const camera=new THREE.PerspectiveCamera(36,1,.1,100);
      camera.position.set(4.1,3.15,5.15);camera.lookAt(0,.05,0);
      const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
      renderer.setClearColor(0x000000,0);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
      scene.add(new THREE.HemisphereLight(0xd8c5ff,0x160b20,2.25));
      const key=new THREE.DirectionalLight(0xffffff,4.6);key.position.set(4,6,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
      const fill=new THREE.DirectionalLight(0x8b48ff,2.5);fill.position.set(-4,2.5,3);scene.add(fill);
      const rim=new THREE.DirectionalLight(0xe7cfff,2.2);rim.position.set(2,3,-5);scene.add(rim);

      const dice=new THREE.Group();
      const body=new THREE.Mesh(new RoundedBoxGeometry(2,2,2,7,.2),new THREE.MeshPhysicalMaterial({color:0x7d35df,roughness:.24,metalness:.06,clearcoat:.55,clearcoatRoughness:.2}));body.castShadow=true;body.receiveShadow=true;dice.add(body);
      const pipMat=new THREE.MeshStandardMaterial({color:0x160b20,roughness:.4});
      const addPip=(face,u,v)=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.04,24),pipMat);const s=1.012;p.castShadow=true;if(face===1){p.position.set(u,v,s);p.rotation.x=Math.PI/2}else if(face===2){p.position.set(s,v,-u);p.rotation.z=-Math.PI/2}else if(face===3){p.position.set(u,s,-v)}else if(face===4){p.position.set(u,-s,v)}else if(face===5){p.position.set(-s,v,u);p.rotation.z=-Math.PI/2}else{p.position.set(-u,v,-s);p.rotation.x=Math.PI/2}dice.add(p)};
      Object.entries(layouts).forEach(([f,arr])=>arr.forEach(([u,v])=>addPip(+f,u,v)));
      dice.rotation.set(-.16,.58,.08);scene.add(dice);

      const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.35,64),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.32,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=-1.08;shadow.scale.y=.42;scene.add(shadow);
      const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.ShadowMaterial({opacity:.18}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.1;floor.receiveShadow=true;scene.add(floor);

      function resize(){const r=canvas.getBoundingClientRect();const w=Math.max(1,r.width),h=Math.max(1,r.height);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize,{passive:true});resize();

      const clock=new THREE.Clock();let rolling=false,idle=0,anim=null;
      function targetQuaternion(normal){const n=new THREE.Vector3(...normal).normalize();const q=new THREE.Quaternion().setFromUnitVectors(n,new THREE.Vector3(0,1,0));const yaw=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),.35);return yaw.multiply(q)}
      const easeOutCubic=t=>1-Math.pow(1-t,3);const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
      function roll(){if(rolling)return;rolling=true;button.disabled=true;button.textContent='JOGANDO…';status.textContent='a má ideia já foi escolhida';resultEl.classList.remove('show');resultEl.textContent='';const face=faces[Math.floor(Math.random()*faces.length)];const startQ=dice.quaternion.clone();const chaosQ=new THREE.Quaternion().setFromEuler(new THREE.Euler((7+Math.random()*3)*Math.PI,(8+Math.random()*3)*Math.PI,(6+Math.random()*3)*Math.PI));const midQ=startQ.clone().multiply(chaosQ);const endQ=targetQuaternion(face.normal);anim={start:performance.now(),duration:2350,startQ,midQ,endQ,face};}
      button.addEventListener('click',roll);canvas.addEventListener('pointerup',roll,{passive:true});

      function frame(now){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(anim){const t=Math.min(1,(now-anim.start)/anim.duration);let y;if(t<.58){const u=t/.58;y=Math.sin(u*Math.PI)*2.55}else{const u=(t-.58)/.42;y=Math.abs(Math.sin(u*Math.PI*2.3))*(1-u)*.48}dice.position.y=y;if(t<.72){const u=easeOutCubic(t/.72);dice.quaternion.slerpQuaternions(anim.startQ,anim.midQ,u)}else{const u=easeInOut((t-.72)/.28);dice.quaternion.slerpQuaternions(anim.midQ,anim.endQ,u)}shadow.scale.set(1-y*.12,.42-y*.035,1);shadow.material.opacity=.32-y*.07;if(t>=1){dice.position.y=0;dice.quaternion.copy(anim.endQ);resultEl.textContent=anim.face.result;resultEl.classList.add('show');button.disabled=false;button.textContent='JOGAR DE NOVO';status.textContent='toque para jogar novamente';rolling=false;anim=null}}else{idle+=dt;dice.position.y=Math.sin(idle*1.25)*.035;dice.rotation.y+=dt*.06}renderer.render(scene,camera)}requestAnimationFrame(frame);
    }catch(err){console.error(err);errorEl.classList.add('show')}
  </script>
</body>
</html>
